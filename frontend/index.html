<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2B1B12" />
    <meta name="author" content="L'Oven Specialty Coffee & Bakery" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Favicon & Touch Icons using L'Oven Brand Logo -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Primary SEO Meta Tags -->
    <title>L'Oven Coffee &amp; Bakery — Artisanal Specialty Coffee &amp; Viennoiserie</title>
    <meta name="description" content="Handcrafted espresso, single-origin African roasts, and authentic French viennoiserie in Kampala. Order online for table service, curbside takeaway, or direct doorstep delivery." />
    <meta name="keywords" content="L'Oven coffee, specialty coffee Kampala, artisanal bakery, French croissants, espresso bar, cold brew, single origin coffee roaster, Kampala cafe delivery, Kampala breakfast" />
    <link rel="canonical" href="https://lovencoffee.com/" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="L'Oven Coffee &amp; Bakery" />
    <meta property="og:title" content="L'Oven Coffee &amp; Bakery — Artisanal Specialty Coffee &amp; Viennoiserie" />
    <meta property="og:description" content="Handcrafted espresso, single-origin African roasts, and authentic French viennoiserie in Kampala. Order online for table service, curbside takeaway, or direct doorstep delivery." />
    <meta property="og:url" content="https://lovencoffee.com/" />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:image:alt" content="L'Oven Coffee &amp; Bakery Logo &amp; Brandmark" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="L'Oven Coffee &amp; Bakery — Artisanal Specialty Coffee &amp; Viennoiserie" />
    <meta name="twitter:description" content="Handcrafted espresso, single-origin African roasts, and authentic French viennoiserie. Order online for table service, takeaway, or doorstep delivery." />
    <meta name="twitter:image" content="/logo.png" />

    <!-- Structured Data (JSON-LD) for Local Business / Cafe & Bakery -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "CafeOrCoffeeShop",
      "name": "L'Oven Coffee & Bakery",
      "image": "https://lovencoffee.com/logo.png",
      "@id": "https://lovencoffee.com/#cafe",
      "url": "https://lovencoffee.com/",
      "telephone": "+256700000001",
      "priceRange": "$$",
      "servesCuisine": [
        "Specialty Coffee",
        "Artisanal Bakery",
        "French Viennoiserie",
        "Espresso & Pour-Over",
        "Pastries & Breakfast"
      ],
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Plot 14 Roastery Lane",
        "addressLocality": "Kampala",
        "addressRegion": "Central Region",
        "addressCountry": "UG"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": 0.3136,
        "longitude": 32.5811
      },
      "openingHoursSpecification": [
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "07:00",
          "closes": "22:00"
        },
        {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Saturday", "Sunday"],
          "opens": "07:30",
          "closes": "22:30"
        }
      ],
      "hasMenu": "https://lovencoffee.com/menu",
      "potentialAction": {
        "@type": "OrderAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://lovencoffee.com/menu",
          "inLanguage": "en-US",
          "actionPlatform": [
            "http://schema.org/DesktopWebPlatform",
            "http://schema.org/MobileWebPlatform"
          ]
        },
        "deliveryMethod": [
          "http://purl.org/goodrelations/v1#DeliveryModeOwnFleet",
          "http://purl.org/goodrelations/v1#DeliveryModePickUp"
        ]
      }
    }
    </script>
  </head>
  <body class="bg-cream-100 font-sans text-brown-900 antialiased selection:bg-[#C8681A] selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
